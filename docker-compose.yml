version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - app-network

  # API Gateway
  api-gateway:
    image: kong:latest
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/etc/kong/kong.yml
    networks:
      - app-network

  # User Service
  user-service:
    build:
      context: ./packages/user-service
      dockerfile: Dockerfile
    volumes:
      - ./packages/user-service:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/db
      - JWT_SECRET=your-super-secret-key
    depends_on:
      - postgres
    networks:
      - app-network

  # Generation Service
  generation-service:
    build:
      context: ./packages/generation-service
      dockerfile: Dockerfile
    volumes:
      - ./packages/generation-service:/app
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # AI Worker
  ai-worker:
    build:
      context: ./packages/ai-worker
      dockerfile: Dockerfile
    volumes:
      - ./packages/ai-worker:/app
      - model-cache:/root/.cache/huggingface
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - app-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

  # Redis Cache
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  model-cache: