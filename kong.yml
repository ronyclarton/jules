_format_version: "2.1"
_comment: "Declarative configuration for Kong API Gateway"

services:
  - name: user-service
    url: http://user-service:3000
    routes:
      - name: user-service-register
        paths:
          - /register
      - name: user-service-login
        paths:
          - /login
      - name: user-service-events
        paths:
          - /events
      - name: user-service-upgrade
        paths:
          - /upgrade-to-pro
      - name: user-service-profile-update
        paths:
          - /profile/update

  - name: generation-service
    url: http://generation-service:8080
    routes:
      - name: generation-service-generate
        paths:
          - /generate
        methods:
          - POST
      - name: generation-service-status
        paths:
          - /models/
        methods:
          - GET
      - name: community-like
        paths:
          - /models/
        methods:
          - POST
          - DELETE

  - name: community-service
    url: http://community-service:8083
    routes:
      - name: community-gallery
        paths:
          - /gallery
        methods:
          - GET
      - name: community-model-detail
        paths:
          - /models/
        methods:
          - GET

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - OPTIONS
      credentials: true
      max_age: 3600