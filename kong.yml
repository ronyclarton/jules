_format_version: "2.1"
_comment: "Declarative configuration for Kong API Gateway"

services:
  - name: user-service
    url: http://user-service:3000 # The internal Docker network address for the user service
    routes:
      - name: user-service-register
        paths:
          - /register
      - name: user-service-login
        paths:
          - /login

  - name: generation-service
    url: http://generation-service:8080 # The internal Docker network address for the generation service
    routes:
      - name: generation-service-generate
        paths:
          - /generate
        methods:
          - POST
      - name: generation-service-status
        paths:
          - /models/
        methods:
          - GET

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      credentials: true
      max_age: 3600